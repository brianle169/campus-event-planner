<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Event</title>
  <link rel="stylesheet" href="/public/css/style.css" />
  <script src="/public/js/utils/toast.js" defer></script>
  <script src="/public/js/pages/admin/eventFormValidations.js" type="module" defer></script>
  <script src="/public/js/main.js" type="module" defer></script>
</head>

<body>
  <header class="site-header">
    <nav class="nav container">
      <a class="nav-brand" href="/">Campus Event Planner</a>
      <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
        <img src="/public/images/menu-svgrepo-com.png" alt="" class="nav-toggle-icon" />
      </button>
      <ul class="nav-links">
        <li><a href="/admin/dashboard">Dashboard</a></li>
        <li><a href="/admin/events">Manage Events</a></li>
        <li><a href="/admin/registrations">Registrations</a></li>
        <li><a class="active" href="/admin/events/new">Create Event</a></li>
      </ul>
      <div class="nav-actions">
        <a class="btn btn-outline" href="#" id="signOutLink">Sign out</a>
      </div>
    </nav>
    <div class="modal" id="logoutModal">
      <div class="modal-content">
        <p>Are you sure you want to sign out?</p>

        <div class="modal-buttons">
          <a href="#" class="btn btn-primary" id="confirm-sign-out">Yes</a>
          <a href="#" class="btn btn-outline" id="noButton">No</a>
        </div>
      </div>
    </div>
  </header>

  <main class="admin container">
    <section class="admin-page-header">
      <div>
        <h1>Create a new event</h1>
        <p class="admin-subtitle">Fill in the details below.</p>
      </div>
    </section>

    <form class="event-form" novalidate>
      <div class="event-form-grid">
        <div class="event-form-field event-form-field--full">
          <label for="title">Event title</label>
          <input type="text" id="title" name="title" required />
          <span class="field-error" id="title-error"></span>
        </div>

        <div class="event-form-field event-form-field--full">
          <label for="description">Description</label>
          <textarea id="description" name="description" rows="5" required></textarea>
          <span class="field-error" id="description-error"></span>
        </div>

        <div class="event-form-field">
          <label for="category">Category</label>
          <select id="category" name="category" required>
            <option value="" disabled selected>Select a category</option>
            <option value="Academic workshop">Academic workshop</option>
            <option value="Career event">Career event</option>
            <option value="Club activity">Club activity</option>
            <option value="Sports event">Sports event</option>
            <option value="Cultural event">Cultural event</option>
            <option value="Volunteering event">Volunteering event</option>
            <option value="Social event">Social event</option>
            <option value="Guest lecture">Guest lecture</option>
            <option value="Networking event">Networking event</option>
            <option value="Other">Other</option>
          </select>
          <span class="field-error" id="category-error"></span>
        </div>

        <div class="event-form-field">
          <label for="status">Status</label>
          <select id="status" name="status" required>
            <option value="open" selected>Open</option>
            <option value="cancelled">Cancelled</option>
            <option value="completed">Completed</option>
            <option value="disabled">Disabled</option>
          </select>
        </div>

        <div class="event-form-field">
          <label for="date">Date</label>
          <input type="date" id="date" name="date" required />
          <span class="field-error" id="date-error"></span>
        </div>

        <div class="event-form-field">
          <label for="capacity">Capacity</label>
          <input type="number" id="capacity" name="capacity" min="1" required />
          <span class="field-error" id="capacity-error"></span>
        </div>

        <div class="event-form-field">
          <label for="start-time">Start time</label>
          <input type="time" id="start-time" name="start-time" required />
          <span class="field-error" id="start-time-error"></span>
        </div>

        <div class="event-form-field">
          <label for="end-time">End time</label>
          <input type="time" id="end-time" name="end-time" required />
          <span class="field-error" id="end-time-error"></span>
        </div>

        <div class="event-form-field event-form-field--full">
          <label for="location">Location</label>
          <input type="text" id="location" name="location" required />
          <span class="field-error" id="location-error"></span>
        </div>

        <div class="event-form-field event-form-field--full">
          <label for="organizer">Admin</label>
          <input type="text" id="organizer" name="organizer" value="Logged User" readonly />
        </div>
      </div>

      <div class="event-form-actions">
        <a class="btn btn-outline" href="/admin/events">Cancel</a>
        <button class="btn btn-primary" type="submit">Create event</button>
      </div>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <small>&copy; 2026 Smart Campus Event Planner. SOEN 287 course project.</small>
      <div class="footer-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </div>
    </div>
  </footer>
</body>

</html>
