<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Page</title>
    <link rel="stylesheet" href="../../public/css/style.css" />
    <script src="../../public/js/main.js" type="module" defer></script>
</head>

<body>
    <header class="site-header">
        <nav class="nav container">
            <a class="nav-brand" href="/">Campus Event Planner</a>
            <button class="nav-toggle" type="button" aria-label="Toggle navigation" aria-expanded="false">
                <img src="../../public/images/menu-svgrepo-com.png" alt="" class="nav-toggle-icon" />
            </button>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/about">About</a></li>
                <li><a href="/contact">Contact</a></li>
            </ul>
            <div class="nav-actions">
                <a class="btn btn-outline" href="/login" data-auth="anon">Log in</a>
                <a class="btn btn-primary" href="/register" data-auth="anon">Sign up</a>
                <a class="btn btn-outline" href="/login" data-auth="user" data-dashboard hidden>My dashboard</a>
                <a class="btn btn-primary" href="#" id="signOutLink" data-auth="user" hidden>Sign out</a>
            </div>
        </nav>
        <div class="modal" id="logoutModal">
            <div class="modal-content">
                <p>Are you sure you want to sign out?</p>

                <div class="modal-buttons">
                    <a href="#" class="btn btn-primary" id="confirm-sign-out">Yes</a>
                    <a href="#" class="btn btn-outline" id="noButton">No</a>
                </div>
            </div>
        </div>
    </header>

    <div class="contact-container">
        <div class="contact-header">
            <h1>Contact</h1>
            <p>
                Have a question, comment or feedback? <br> Fill out the form below.</a>
            </p>
        </div>
        <form class="contact">
            <div class="contact-field">
                <label for="name">Name</label>
                <input type="text" id="name" name="name" required />
                <span class="field-error" id="name-error"></span>
            </div>
            <div class="contact-field">
                <label for="email">Email address</label>
                <input type="email" id="email" name="email" required />
                <span class="field-error" id="email-error"></span>
            </div>
            <div class="contact-field">
                <label for="text">Message</label>
                <textarea id="text" name="textarea" required></textarea>
                <span class="field-error" id="text-error"></span>
            </div>
            <button class="btn btn-primary" type="submit">Send</button>
        </form>
    </div>

    <footer class="site-footer">
        <div class="container footer-inner">
            <small>&copy; 2026 Smart Campus Event Planner. SOEN 287 course
                project.</small>
            <div class="footer-links">
                <a href="/">Home</a>
                <a href="/about">About</a>
                <a href="/contact">Contact</a>
            </div>
        </div>
    </footer>
</body>

</html>
